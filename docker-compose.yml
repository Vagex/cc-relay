version: '3.8'

services:
  codex-relay:
    build: .
    container_name: codex_relay
    restart: always
    # 刪除 network_mode: "host"
    ports:
      # 必須明確映射端口，Windows 才能訪問到容器
      - "4446:4446"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"